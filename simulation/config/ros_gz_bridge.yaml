# This file tells ros_gz_bridge which Gazebo Transport topics should
# be mirrored onto real ROS 2 topics (and in which direction), so that
# ordinary ROS 2 nodes (teleop, RViz, a future planner, etc.) can talk
# to the simulated rover without knowing anything about Gazebo.
#
# direction: ROS_TO_GZ means "a ROS 2 publisher drives this; Gazebo
#            listens" (this is how we send velocity commands IN).
# direction: GZ_TO_ROS means "Gazebo publishes this; ROS 2 nodes can
#            subscribe" (this is how we get data like odometry OUT).
#
# The gz_topic_name values below (e.g. "/model/rover/odometry") were
# confirmed by running "gz topic -l" while the simulation was running
# — they come from our DiffDrive and JointStatePublisher plugins in
# simulation/models/rover/model.sdf.

- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/model/rover/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/model/rover/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/openrover_world/model/rover/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
